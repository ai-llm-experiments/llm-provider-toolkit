    input_cost_per_token: 0.0
    output_cost_per_token: 0.0
    max_input_tokens: 1048576
    max_output_tokens: 262144
    mode: chat
    supports_vision: true
    metadata:
      notes: Ling 3.2 Flash is a hybrid reasoning model from inclusionAI that accepts
        text and image input, with a 1M-token context window and up to 200 images
