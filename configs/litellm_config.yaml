    model: openai/thinkingmachines/inkling-2-mini
    api_base: https://openrouter.ai/api/v1
    api_key: os.environ/OPENROUTER_API_KEY
    input_cost_per_token: 7.5e-08
    output_cost_per_token: 3.0e-07
    max_input_tokens: 1048576
    max_output_tokens: 65536
    mode: chat
    supports_vision: true
    metadata: &id001
      notes: Inkling 2 Mini is an open-weight multimodal looped transformer from Thinking
        Machines Lab, with 3.4B active parameters out of 26.4B total (MoE). Its middle
        layers run three times with shared...
    litellm_provider: openrouter
